[package]
name = "pdf2docx-app"
version = "0.1.0"
description = "Convert PDF to DOCX with real Word structure"
edition = "2021"
rust-version = "1.96.0"

[lib]
name = "pdf2docx_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
